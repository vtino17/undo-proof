name: Bug report
description: Report reproducible UndoProof behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Remove credentials and production identifiers before sharing a plan.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal redacted plan and the command used.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js, pnpm, and operating-system versions.
